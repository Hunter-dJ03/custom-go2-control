# Go2 ZED2i overrides — only parameters that differ from stock zed-ros2-wrapper defaults.
# Applied via sensors.launch.py → ros_params_override_path (loads after common_stereo + zed2i.yaml).
#
# Upstream reference: stereolabs/zed-ros2-wrapper (common_stereo.yaml, zed2i.yaml @ HEAD).
# Revert local edits under src/vendor/.../zed_wrapper/config/ and tune here instead.
---
/**:
  ros__parameters:
    general:
      camera_timeout_sec: 20
      camera_max_reconnect: 20
      # ZED odom (/zed/zed_node/odom) publishes once per successful SDK grab — same rate as
      # positional tracking, NOT the 100 Hz IMU. grab_frame_rate must be a valid combo for the
      # camera model + resolution (ZED2i HD720: 15/30/60 only — 20 is invalid and clamps to 15).
      # For up to 100 Hz odom use grab_resolution: 'VGA' and grab_frame_rate: 100 (heavier GPU load;
      # NEURAL depth may still cap the real rate on Jetson — try NEURAL_LIGHT or lower resolution).
      grab_frame_rate: 30

    depth:
      depth_mode: 'NEURAL'
      min_depth: 0.1
      point_cloud_freq: 5.0
      depth_confidence: 60
      # voxel_point_cloud: true
      # voxel_size_mm: 50.0
      # voxel_resolution_mode: 'STEREO_UNCERTAINTY'
      # voxel_resolution_scale: 0.2

    pos_tracking:
      pos_tracking_mode: 'GEN_3'
      # When using go2_slam zed.launch.py use_zed_odometry:=true with zed_publish_odom_tf,
      # keep this as camera_odom so ZED VO TF does not fight go2_bridge on frame "odom".
      # go2_slam rtabmap.launch.py odom_source:=zed consumes the odom topic only (no ZED TF);
      # odometry_frame can stay camera_odom — odom_rebase_node republishes as frame "odom".
      odometry_frame: 'camera_odom'

    gnss_fusion:
      publish_utm_tf: false
